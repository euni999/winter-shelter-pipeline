# 최상위 version: 키는 Compose v2에서 더 이상 쓰지 않아(무시되고 경고만 남) 생략했다.

# ── Airflow 공통 설정 ─────────────────────────────────────────────
# Airflow 서비스 4개(init/apiserver/scheduler/dag-processor)가 같은 설정을 쓰므로
# 한 번만 적고 YAML 앵커(&)로 재사용한다. 공식 docker-compose.yaml(3.3.2)을 기준으로
# Celery·Redis·worker·triggerer·flower를 뺀 LocalExecutor용 축소판이다.
x-airflow-common: &airflow-common
  # 3.3.2 고정 이유: 3.4.0은 2026-11-06에 나온 지 일주일 된 .0 버전이라 초기 버그 위험이 있고,
  # 3.3.2는 3.3 계열 마지막 패치(2026-09-17)로 두 달간 쓰이며 안정화됐다.
  # Python도 태그에 명시: 안 쓰면 이미지 기본값이 바뀔 때 조용히 달라질 수 있다.
  image: apache/airflow:3.3.2-python3.12
  # env_file로 .env 전체를 넘기지 않고 필요한 값만 골라 넘긴다.
  # → API 키 등 Airflow에 필요 없는 비밀이 컨테이너에 들어가지 않는다.
  # ${VAR:?메시지}: .env에 값이 없으면 시작 자체를 막아 빈 비밀번호로 뜨는 사고를 방지.
  environment: &airflow-common-env
    # 단일 머신이라 Celery(작업자 분산) 대신 LocalExecutor: scheduler가 직접 태스크를 실행한다.
    # → Redis와 worker 컨테이너가 필요 없어 메모리를 아낀다.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # 공식 구성과 같은 FAB 로그인 화면: 아이디/비밀번호로 로그인하는 방식.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # 메타데이터 DB = 아래 airflow-db (우리 데이터용 db와 분리).
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?}:${AIRFLOW_DB_PASSWORD:?}@airflow-db/${AIRFLOW_DB_NAME:?}
    # Airflow 3에선 태스크가 apiserver에 실행 결과를 보고한다 → 그 주소와 서명용 비밀키.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?}
    # Connection/Variable에 저장할 비밀을 암호화하는 키. 비워두면 평문 저장(경고만 남).
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    # 예제 DAG 수십 개를 끄면 화면이 깔끔하고 가볍다.
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # 새 DAG는 일시정지 상태로 등록 → 내가 확인하고 켜기 전엔 API를 호출하지 않는다.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    # 내 PC 폴더를 컨테이너에 연결: dags/에 파일을 넣으면 Airflow가 바로 읽고,
    # 실행 로그는 logs/에 남아 PC에서 볼 수 있다. (없으면 Docker가 빈 폴더를 만든다)
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy

services:
  db:
    # 버전을 16으로 고정 — latest를 쓰면 언젠가 메이저 버전이 바뀌어
    # 기존 데이터 디렉터리와 호환이 깨질 수 있기 때문.
    image: postgres:16
    # 계정/비밀번호를 이 파일에 직접 쓰지 않고 .env에서 읽는다.
    # → docker-compose.yml은 커밋해도 비밀번호가 노출되지 않음.
    env_file: .env
    ports:
      # "내 PC 포트:컨테이너 포트". 내 PC의 DBeaver/psql 등에서
      # localhost:5432로 접속하기 위해 열어둔다.
      - "5432:5432"
    volumes:
      # 컨테이너 안의 실제 데이터 폴더를 이름 있는 볼륨(pgdata)에 연결.
      # 컨테이너를 지우고 다시 만들어도 데이터는 볼륨에 남는다.
      - pgdata:/var/lib/postgresql/data

  # Airflow 전용 메타데이터 DB (실행 이력·계정 등). 우리 데이터 db와 분리해서
  # Airflow를 초기화/업그레이드해도 적재 데이터에 영향이 없게 한다.
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:?}
    # ports를 열지 않음: Airflow 컨테이너끼리만 쓰면 되고, 5432는 이미 db가 쓰고 있다.
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    # Airflow가 DB가 "접속 가능"해진 뒤에 시작하도록 상태 검사를 둔다.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER:?}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # 한 번만 실행되고 끝나는 준비 작업: 메타데이터 DB 테이블 생성(migrate) + 관리자 계정 생성.
  # 이미지의 entrypoint가 아래 _AIRFLOW_* 값을 보고 처리한 뒤 `airflow version`을 실행하고 종료한다.
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?}

  # 웹 UI + API 서버 (Airflow 3에서 webserver를 대체). 브라우저에서 localhost:8080.
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      # init이 성공적으로 끝난 뒤에만 시작 (DB 테이블이 없으면 실패하므로).
      airflow-init:
        condition: service_completed_successfully

  # 언제 무엇을 실행할지 정하고, LocalExecutor라 태스크도 여기서 실제 실행된다.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # dags/ 폴더의 파이썬 파일을 읽어 DAG로 등록한다. Airflow 3부터 scheduler와 분리된 별도 서비스.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

# 위에서 쓴 이름 있는 볼륨을 여기서 선언해야 Docker가 만들어 관리한다.
volumes:
  pgdata:
  airflow-pgdata:
