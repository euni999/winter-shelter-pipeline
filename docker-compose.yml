# 최상위 version: 키는 Compose v2에서 더 이상 쓰지 않아(무시되고 경고만 남) 생략했다.
services:
  db:
    # 버전을 16으로 고정 — latest를 쓰면 언젠가 메이저 버전이 바뀌어
    # 기존 데이터 디렉터리와 호환이 깨질 수 있기 때문.
    image: postgres:16
    # 계정/비밀번호를 이 파일에 직접 쓰지 않고 .env에서 읽는다.
    # → docker-compose.yml은 커밋해도 비밀번호가 노출되지 않음.
    env_file: .env
    ports:
      # "내 PC 포트:컨테이너 포트". 내 PC의 DBeaver/psql 등에서
      # localhost:5432로 접속하기 위해 열어둔다.
      - "5432:5432"
    volumes:
      # 컨테이너 안의 실제 데이터 폴더를 이름 있는 볼륨(pgdata)에 연결.
      # 컨테이너를 지우고 다시 만들어도 데이터는 볼륨에 남는다.
      - pgdata:/var/lib/postgresql/data

# 위에서 쓴 이름 있는 볼륨을 여기서 선언해야 Docker가 만들어 관리한다.
volumes:
  pgdata:
